name: ShopCart CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shopcart
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: 123456
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run Backend Unit Tests (JUnit 5 + Mockito)
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5433/testdb
          SPRING_DATASOURCE_USERNAME: admin
          SPRING_DATASOURCE_PASSWORD: password
        run: |
          cd backend
          ./mvnw clean test jacoco:report

      - name: Upload Backend Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/target/site/jacoco/jacoco.xml
          flags: backend

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Unit Tests (Vitest)
        run: |
          cd frontend
          npm run test:coverage

      - name: Upload Frontend Coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend

  e2e-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
      - uses: actions/checkout@v4

      # Java backend
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      # Node frontend
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install frontend deps (1 lần duy nhất)
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      # Install Playwright
      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      # Start backend (cải tiến: chạy background + log)
      - name: Start Backend Server
        run: |
          cd backend
          ./mvnw spring-boot:run > backend.log 2>&1 &
          echo $! > backend.pid 

      # Wait backend ready (quan trọng hơn sleep)
      - name: Wait Backend Ready
        run: |
          for i in {1..30}; do
            curl --fail http://localhost:8080/actuator/health && break
            echo "Waiting backend..."
            sleep 2
          done

      # Start frontend
      - name: Start Frontend Server
        run: |
          cd frontend
          npm run dev > frontend.log 2>&1 &
          echo $! > frontend.pid

      # Wait frontend ready
      - name: Wait Frontend Ready
        run: |
          for i in {1..30}; do
            curl --fail http://localhost:3000 && break
            echo "Waiting frontend..."
            sleep 2
          done

      # Run E2E
      - name: Run Playwright Tests
        run: |
          cd frontend
          npm run e2e

      # Stop servers (cleanup)
      - name: Cleanup Servers
        if: always()
        run: |
          kill $(cat backend/backend.pid) || true
          kill $(cat frontend/frontend.pid) || true

      # Upload report
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: frontend/playwright-report/
          retention-days: 30
