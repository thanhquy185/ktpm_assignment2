name: ShopCart CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  cart-e2e-test:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - uses: actions/checkout@v4

      # Node frontend
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install frontend deps (1 lần duy nhất)
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      # Install Playwright
      - name: Install Playwright Browsers
        run: |
          cd frontend
          npx playwright install --with-deps

      # Start frontend
      - name: Start Frontend Server
        run: |
          cd frontend
          npm run dev > frontend.log 2>&1 &
          echo $! > frontend.pid

      # Wait frontend ready
      - name: Wait Frontend Ready
        run: |
          for i in {1..30}; do
            curl --fail http://localhost:3000 && break
            echo "Waiting frontend..."
            sleep 2
          done

      # Run E2E
      - name: Run Playwright Tests
        run: |
          cd frontend
          npm run e2e tests/e2e/cart.e2e.spec.ts

      # Stop servers (cleanup)
      - name: Cleanup Servers
        if: always()
        run: |
          kill $(cat backend/backend.pid) || true
          kill $(cat frontend/frontend.pid) || true

      # Upload report
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-html-report
          path: frontend/playwright-report/
          retention-days: 30
